name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check (format + lint)
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      # The Postgres tests start their own container per test file (src/server/backend/testPostgres.ts).
      # Pulled here, from the image that file names, so the pull doesn't count against test timeouts.
      - name: Pull the Postgres test image
        run: docker pull "$(sed -n 's/^const IMAGE = "\(.*\)";$/\1/p' src/server/backend/testPostgres.ts)"

      - name: Test
        run: vp test run

      - name: Build
        run: vp run build

      # The tarball as teams install it: the bundle alone must serve the backend on a fresh
      # Postgres, link a commit to the session that wrote it, and send it from a push's hook.
      - name: Package smoke test
        run: sh scripts/smoke.sh
